name: poultry_pro
description: Poultry management app for African farmers
publish_to: 'none'
version: 1.0.3+9

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  file_picker: ^8.1.2
  connectivity_plus: ^6.0.0
  uuid: ^4.3.3
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  package_info_plus: ^8.0.0
  screenshot: ^3.0.0
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.2
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/splash/splash.png"
  android: true
  ios: true
  web: false
